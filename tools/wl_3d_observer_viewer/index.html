<!doctype html><html><head><meta charset="utf-8"><title>Dev 117 Observer Volume</title><link rel="stylesheet" href="viewer.css"></head>
<body><header><h1>Full 3D Observer Volume</h1><b>VISUALIZATION_NORMALIZATION_ONLY</b></header>
<section class="controls"><label>Mode <select id="mode"><option>DEPTH_SCAN</option><option>RGB</option><option>LENS_RAY_REGISTRATION</option><option>TRACE_FROM_LENS</option><option>LAUNCH / RECEIVED</option><option>COHORT RGB</option><option>BUNDLE_TRANSPORT</option><option>SHOW_FOLD_CANDIDATES</option></select></label><label>Bundle scale <select id="bundleScale"><option>1</option><option>2</option><option>4</option><option>8</option></select></label><label>Support resolution <select id="bundleResolution"><option>64</option><option>128</option><option>256</option></select></label><label>Fold layers <select id="foldLayer" multiple><option>det sign-change boundary</option><option>orientation-flip bundles</option><option>multi-origin overlap</option><option>near-singular bundles</option></select></label><label><input id="lensOverlay" type="checkbox"> Show registered lens footprint</label><span id="lensLegend">REGISTERED FROM SOURCE GEOMETRY — NOT FIT TO VIEW</span><label>Ray cohort <select id="cohort"><option>all rays</option><option>lens core</option><option>lens inner</option><option>lens outer</option><option>near lens</option><option>far control</option></select></label><label>Orientation <select id="orientation"><option>XY</option><option>XZ</option><option>YZ</option></select></label><label>Projection <select id="projection"><option>single slice</option><option>sum</option><option>mean</option><option>maximum</option><option>RMS</option></select></label><label>Slice <input id="slice" type="range" min="0" max="63" value="32"><span id="sliceValue">32</span></label><label>Minimum occupancy <input id="minocc" type="number" value="1" min="0"></label><label>Display magnitude <input id="magnitude" type="range" min="1" max="100" value="98"></label></section>
<main id="panels"></main><aside><h2>RGB composite</h2><canvas id="rgb" width="512" height="512"></canvas><div id="rgbLabel">COHORT COLORING — NOT PHYSICAL RGB</div><div id="corr"></div><div id="inspection">Click a received region to inspect rays; TRACE_FROM_LENS shows their destinations.</div></aside><script src="viewer.js"></script></body></html>
